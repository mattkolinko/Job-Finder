name: Daily job email
on:
  schedule:
    - cron: "0 13 * * *"   # 7am Mountain time
  workflow_dispatch:
permissions:
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python notify.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
